name = "meyers-family-events-state"
main = "worker.js"
compatibility_date = "2026-09-17"

[vars]
# Prefer a separate private repository because the state contains guest names.
GITHUB_REPOSITORY = "YOUR_GITHUB_NAME/YOUR_PRIVATE_DATA_REPOSITORY"
GITHUB_BRANCH = "main"
GITHUB_STATE_PATH = "data/app-state.json"
ALLOWED_ORIGIN = "https://YOUR_GITHUB_NAME.github.io"
